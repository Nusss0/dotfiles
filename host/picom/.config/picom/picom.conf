backend = "glx";
vsync = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# Let Alacritty's own opacity setting through untouched
detect-client-opacity = true;
detect-rounded-corners = true;
use-damage = true;

corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'"
];
