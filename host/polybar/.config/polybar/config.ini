[colors]
pill    = #16161e
fg      = #c0caf5
dim     = #565f89
accent  = #7aa2f7
green   = #9ece6a
yellow  = #e0af68
red     = #f7768e
magenta = #bb9af7
cyan    = #7dcfff

[bar/main]
width  = 98%
height = 26pt
offset-x = 1%
offset-y = 8px
bottom = false
fixed-center = true
override-redirect = true
wm-restack = i3

background = #00000000
foreground = ${colors.fg}

line-size = 0
border-size = 0
padding-left = 0
padding-right = 0
module-margin = 0

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-1 = "JetBrainsMono Nerd Font:style=Regular:size=25;7"
font-2 = "Noto Sans CJK SC:size=10;2"
font-3 = "JetBrainsMono Nerd Font:size=12;3"

modules-left   = ld i3 sep caffeine rd gap ld music rd
modules-center = ld date rd
modules-right  = ld cpu memory filesystem sep bluetooth wlan pulseaudio backlight battery sep tray power rd

cursor-click = pointer
enable-ipc = true

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/ld]
type = custom/text
format = <label>
format-background = #00000000
format-foreground = ${colors.pill}
label = "%{T2}%{T-}"

[module/rd]
type = custom/text
format = <label>
format-background = #00000000
format-foreground = ${colors.pill}
label = "%{T2}%{T-}"

[module/sep]
type = custom/text
format = <label>
format-background = ${colors.pill}
label = "|"
label-foreground = ${colors.dim}
label-padding = 1

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
format-background = ${colors.pill}
label-focused = %name%
label-focused-foreground = ${colors.accent}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.fg}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

[module/caffeine]
type = custom/script
exec = ~/.config/i3/scripts/caffeine.sh
interval = 5
format = <label>
format-background = ${colors.pill}
label = " %output% "
click-left = ~/.config/i3/scripts/caffeine.sh toggle &

[module/date]
type = internal/date
interval = 1
format-background = ${colors.pill}
date = %H:%M
date-alt = %a %d %b  %H:%M
label = "  %date% "
label-foreground = ${colors.fg}

[module/cpu]
type = internal/cpu
interval = 2
format-background = ${colors.pill}
format-prefix = "  "
format-prefix-foreground = ${colors.magenta}
label = "%percentage:2%% "

[module/memory]
type = internal/memory
interval = 3
format-background = ${colors.pill}
format-prefix = "  "
format-prefix-foreground = ${colors.green}
label = "%percentage_used:2%% "

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 60
format-mounted-background = ${colors.pill}
label-mounted = " %{F#7dcfff}%{F-} %free% "
format-unmounted-background = ${colors.pill}
label-unmounted = ""

[module/wlan]
type = internal/network
interface = wlan0
interval = 3

format-connected = <label-connected>
format-connected-background = ${colors.pill}
format-connected-prefix = "   "
format-connected-prefix-foreground = ${colors.green}
format-connected-prefix-font = 4
label-connected = "%essid% "
label-connected-maxlen = 10
label-connected-ellipsis = true

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.pill}
format-disconnected-prefix = "   "
format-disconnected-prefix-foreground = ${colors.red}
label-disconnected = "off "

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume-background = ${colors.pill}
format-volume-prefix = "   "
format-volume-prefix-foreground = ${colors.cyan}
label-volume = "%percentage%% "
format-muted-background = ${colors.pill}
format-muted-prefix = "   "
format-muted-prefix-foreground = ${colors.red}
label-muted = "muted "
label-muted-foreground = ${colors.dim}
click-right = pavucontrol &

[module/backlight]
type = internal/backlight
card = intel_backlight
use-ui-max = true
enable-scroll = true
format-background = ${colors.pill}
format-prefix = "  "
format-prefix-foreground = ${colors.yellow}
label = "%percentage%% "

[module/battery]
type = internal/battery
battery = BAT1
adapter = ADP1
full-at = 98
low-at = 15
poll-interval = 5
format-charging-background = ${colors.pill}
format-discharging-background = ${colors.pill}
format-full-background = ${colors.pill}
format-charging    = " <animation-charging> <label-charging>"
format-discharging = " <ramp-capacity> <label-discharging>"
format-full        = " <label-full>"
label-charging    = "%percentage%% "
label-discharging = "%percentage%% "
label-full        = "%{F#9ece6a}%{F-} %percentage%% "
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.yellow}
ramp-capacity-foreground   = ${colors.green}
animation-charging-0 = 
animation-charging-foreground = ${colors.yellow}
animation-charging-framerate = 750

[module/tray]
type = internal/tray
format-background = ${colors.pill}
tray-background = ${colors.pill}
tray-spacing = 6pt
tray-size = 60%
format-padding = 4px


[module/power]
type = custom/text
format = <label>
format-background = ${colors.pill}
label = "  "
label-foreground = ${colors.red}
click-left = ~/.config/i3/scripts/powermenu.sh &



[module/bluetooth]
type = custom/script
exec = ~/.config/i3/scripts/bluetooth-status.sh
interval = 5
format = <label>
format-background = ${colors.pill}
format-prefix = " %{T4}󰂯%{T-} "
format-prefix-foreground = ${colors.accent}
label = "%output:0:10:…% "
label-foreground = ${colors.fg}
click-left = ~/.config/i3/scripts/bluetooth.sh &


[module/music]
type = custom/script
exec = ~/.config/i3/scripts/music.sh
interval = 0.05
format = <label>
format-background = ${colors.pill}
label = "%output% "
label-foreground = ${colors.fg}
click-left = playerctl --player=spotify,chromium,firefox,%any play-pause &

[module/gap]
type = custom/text
format = <label>
format-background = #00000000
label = "  "

