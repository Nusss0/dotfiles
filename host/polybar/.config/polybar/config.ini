;═══ Tokyo Night ══════════════════════════════════════════════
[colors]
bg       = #1a1b26
bg-alt   = #16161e
fg       = #c0caf5
fg-dim   = #565f89
accent   = #7aa2f7
green    = #9ece6a
yellow   = #e0af68
red      = #f7768e
magenta  = #bb9af7
cyan     = #7dcfff

[bar/main]
width  = 100%
height = 28
bottom = true
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
padding-left  = 1
padding-right = 1
module-margin = 1

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=13;3

modules-left   = i3
modules-center = title
modules-right  = pulseaudio memory cpu filesystem wlan battery date

cursor-click  = pointer
enable-ipc    = true

tray-position = right
tray-padding  = 2
tray-maxsize  = 18

;═══ Modules ══════════════════════════════════════════════════

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.bg}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

[module/title]
type = internal/xwindow
label = %title:0:70:...%
label-foreground = ${colors.fg-dim}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.magenta}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = " "
format-prefix-foreground = ${colors.green}
label = %gb_used%

[module/filesystem]
type = internal/fs
mount-0 = /
interval = 60
label-mounted = %{F#7dcfff}%{F-} %free%
label-unmounted =

[module/wlan]
type = internal/network
interface = wlan0
interval = 3

format-connected = <label-connected>
label-connected = %{F#9ece6a}%{F-} %essid%

format-disconnected = <label-disconnected>
label-disconnected = %{F#f7768e}%{F-} off

[module/battery]
type = internal/battery
battery = BAT1
adapter = ADP1
full-at = 98
low-at = 15
poll-interval = 5

format-charging   = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>

label-charging    = %percentage%%
label-discharging = %percentage%%
label-full = %{F#9ece6a}%{F-} %percentage%%
label-low  = %{F#f7768e}%{F-} %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-0-foreground = ${colors.red}
ramp-capacity-1-foreground = ${colors.yellow}
ramp-capacity-foreground   = ${colors.green}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.yellow}
animation-charging-framerate = 750

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

label-muted = %{F#565f89} muted%{F-}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.cyan}

click-right = pavucontrol &

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %{F#7aa2f7}%{F-} %date%  %{F#7aa2f7}%{F-} %time%
