# ─── Prefix ───────────────────────────────────────────────────
# C-b collides with page-up in vim/nvim
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

# ─── General ──────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g display-time 2000

# ─── Colour / terminal ────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ─── Clipboard ────────────────────────────────────────────────
set -g set-clipboard on
set -ag terminal-features ',*:clipboard'

# ─── Reload ───────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "reloaded"

# ─── Splits: open in the current directory ────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation ──────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resize (repeatable: hold without re-prefixing) ──────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window navigation ────────────────────────────────────────
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# ─── Copy mode: vi keys ───────────────────────────────────────
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# Yank: xclip locally, OSC 52 fallback elsewhere
if-shell '[ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1' \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -i'" \
  "bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel"

# ─── Status bar ───────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=colour234,fg=colour250"
set -g status-left  "#[bg=colour39,fg=colour234,bold] #S #[default] "
set -g status-right "#[fg=colour245]#(whoami)@#h #[fg=colour39]%H:%M "
set -g status-left-length 30
set -g status-right-length 60
setw -g window-status-current-style "fg=colour39,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
set -g pane-active-border-style "fg=colour39"
set -g pane-border-style "fg=colour238"

# ─── Local overrides (never committed) ────────────────────────
if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
